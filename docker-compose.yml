version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: pulsehr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pulsehr_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - pulsehr-network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: pulsehr-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pulsehr_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pulsehr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: pulsehr-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pulsehr-network

volumes:
  db_data:

networks:
  pulsehr-network:
    driver: bridge
